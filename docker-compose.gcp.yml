services:
  web:
    restart: unless-stopped

  api:
    restart: unless-stopped
    volumes:
      - "${YS_GCP_DATA_DIR:-/srv/ys/gcp/data}:/data"
      - "${YS_GCP_UPLOADS_DIR:-/srv/ys/gcp/uploads}:/app/py/S3"
      - "${YS_BACKEND_ENV_FILE:?Set YS_BACKEND_ENV_FILE to the GCP backend env file}:/run/config/backend.env:ro"

  extract-worker:
    restart: unless-stopped
    volumes:
      - "${YS_GCP_DATA_DIR:-/srv/ys/gcp/data}:/data"
      - "${YS_GCP_UPLOADS_DIR:-/srv/ys/gcp/uploads}:/app/py/S3"
      - "${YS_BACKEND_ENV_FILE:?Set YS_BACKEND_ENV_FILE to the GCP backend env file}:/run/config/backend.env:ro"

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

volumes:
  ys_uat_pgdata:
    name: ys-gcp-pgdata
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${YS_GCP_PGDATA_DIR:-/srv/ys/gcp/pgdata}
  ys_uat_redisdata:
    name: ys-gcp-redisdata
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${YS_GCP_REDISDATA_DIR:-/srv/ys/gcp/redisdata}
